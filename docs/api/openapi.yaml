openapi: 3.0.3

info:
  title: AI Foundry Opportunity Tracker API
  version: 0.1.0
  description: |
    API contract for the AI Foundry opportunity tracker.

    This file is the single source of truth for the frontend and backend.
    Change it through a pull request and let both sides review it before merging.

    **Product backlog priorities:** US01-US07 are Must-have and US08 is
    Should-have. MoSCoW priority describes the importance of a story for the
    product and does not mean that every Must-have story must be completed in
    Sprint 1.

    **Sprint scope:** US01 and US02 form the initial submission and tracking
    workflow. Sprint 2 adds manager assessment (US03), project delivery
    (US04), project benefit recording (US05), filtering (US06) and account
    authentication. Sprint 3 adds the benefits summary API (US07); the dashboard
    screen must use this summary to display estimated-versus-actual comparisons.
    The opportunity history API (US08) records subsequent changes and returns
    a read-only timeline for managers. Its frontend timeline is a separate task.
    US09 extends the existing in-app notifications with atomic generation and
    read/unread retrieval. Notifications are not sent by email.
    US10 stores existing solutions in a manager-controlled catalogue and grounds
    the pre-submission chatbot in verified, active, accessible catalogue results.
    The chatbot never prevents submission, including after a recommendation or failure.

    **Sign-in:** provisioned coursework accounts use email and an application
    password. Login creates a PostgreSQL-backed session in the HttpOnly
    `foundry.sid` cookie. Cookies use SameSite=Lax and Secure under HTTPS.
    Sessions expire after 30 minutes idle or eight hours total. Public account
    registration and institutional Microsoft sign-in are outside this version.
    The LSBU-looking usernames are demo identifiers, not university mailboxes.
    `X-User-Email` never authenticates a request.

    **CSRF:** first call GET /auth/csrf and retain its anonymous session cookie.
    Send the returned token in X-CSRF-Token when logging in. Login rotates both
    the session identifier and token. Login and GET /auth/me return the current
    token for subsequent POST, PUT, PATCH and DELETE requests, including logout.
    Browser requests use the same origin through the Vite API proxy.

    **Roles:** `staff`, `manager` (Digital Project Manager) and `team`
    (AI Foundry team member).

    **Status lifecycle:**
    `submitted` -> `in_assessment` -> `approved` or `rejected`.
    Project delivery has a separate status. Once approved, an opportunity
    can be moved into Project Delivery by a manager.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Password login and PostgreSQL sessions
  - name: Opportunities
    description: Submitting and viewing opportunities (US01, US02, US03)
  - name: Assessment
    description: Assessing, prioritising and deciding (US03)
  - name: Delivery
    description: Tracking project delivery (US04)
  - name: Benefits
    description: Recording project benefits (US05) and benefits summary data (US07)
  - name: History
    description: Read-only opportunity and linked delivery timeline (US08)
  - name: Notifications
    description: In-app updates and read status for the opportunity owner (US09)
  - name: Solutions
    description: Verified existing solutions and manager-controlled catalogue (US10)

security:
  - cookieSession: []

paths:
  /solutions/check:
    post:
      tags: [Solutions]
      operationId: checkExistingSolutions
      summary: Check verified catalogue candidates before submitting (US10)
      description: |
        Uses server-side Gemini for private developer experiments. Search retrieves up to
        eight active, verified candidates available to the caller; if no terms
        match, up to eight available entries form a bounded semantic fallback.
        When no accessible verified entries exist, returns none without calling AI.
        This is a bounded search, not proof that no university-wide solution exists.
        AI selects at most three candidate IDs or asks one relevant follow-up question.
        IDs are validated again on the server; names, descriptions, links and access
        instructions come from current catalogue records, not model output.
        Withdrawn, restricted or changed candidates are discarded before responding.
        Never sends private verification metadata or API keys in the prompt.
        Limited to 20 checks per signed-in account per five minutes per API process.
        Uses a Google Free-tier project without linked billing; the server cannot
        verify the Google billing tier. This private adapter is disabled in production.
        Google terms require a separate paid-services decision for UK user-facing deployment.
        Only gemini-3.5-flash-lite and gemini-3.1-flash-lite are accepted. No paid
        fallback, OpenAI fallback, automatic retry or external search tool is enabled.
        Timeout is 20 seconds; output cap is 1024 tokens. No-match, provider failure and rate limiting never
        prevent POST /opportunities; canSubmit is always true in check results.
        Previous messages are bounded client context, not a server-persisted transcript.
      security:
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolutionCheckInput'
            example:
              text: A meeting room for our staff team.
              previousMessages:
                - role: user
                  text: I need to book rooms.
                - role: assistant
                  text: Is this a staff meeting room or a student study room?
      responses:
        '200':
          description: Match, no match or clarification. Staff may always submit anyway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionCheckResult'
              example:
                decision: clarify
                question: Is this a staff meeting room or a student study room?
                matches: []
                canSubmit: true
                message: Is this a staff meeting room or a student study room?
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Per-user check limit reached; ordinary submission remains available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionCheckFailure'
        '502':
          description: Gemini failed, refused, timed out or returned invalid output. No provider details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionCheckFailure'
        '503':
          description: Gemini key is missing, model is not allowed, private adapter is in production mode, or Google quota is exhausted; submission remains available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionCheckFailure'

  /solutions:
    get:
      tags: [Solutions]
      operationId: searchSolutions
      summary: Search verified active solutions available to the signed-in user
      description: |
        Staff and engineers receive all_users entries only. Managers may also
        receive manager_only entries. Draft and archived entries are excluded.
        Verification notes and account IDs are never part of this response.
        Keyword search matches any meaningful term in name, description or keywords;
        matches rank by term count, then name and ID. Empty search lists available entries.
      parameters:
        - $ref: '#/components/parameters/SolutionSearch'
        - $ref: '#/components/parameters/SolutionLimit'
      responses:
        '200':
          description: Available solutions, including an empty list when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionSearchPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

  /solutions/catalogue:
    get:
      tags: [Solutions]
      operationId: listSolutionCatalogue
      summary: Manager-only catalogue list, including drafts and archived entries
      parameters:
        - $ref: '#/components/parameters/SolutionSearch'
        - $ref: '#/components/parameters/SolutionLimit'
        - name: state
          in: query
          schema:
            type: string
            enum: [all, verified, draft, archived]
            default: all
      responses:
        '200':
          description: Manager catalogue results with verification metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionCataloguePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Solutions]
      operationId: createSolutionCatalogueEntry
      summary: Create a catalogue entry as a manager
      security:
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolutionInput'
      responses:
        '201':
          description: Created entry with server-owned verification and author metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSolution'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

  /solutions/catalogue/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Solutions]
      operationId: replaceSolutionCatalogueEntry
      summary: Replace, verify, unverify or archive a catalogue entry as a manager
      description: |
        Supply the full editable record. Optional fields reset to defaults when
        omitted. Set active=false to archive without deleting. Setting verified=true
        requires verificationNotes and stamps the current manager and date on the server.
        Setting verified=false clears verifiedBy and verifiedAt. Reverify edited content
        explicitly; omission of verified defaults to false. There is no delete endpoint.
      security:
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolutionInput'
      responses:
        '200':
          description: Saved catalogue entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSolution'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Catalogue entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Start an anonymous session and obtain a CSRF token
      security: []
      responses:
        '200':
          description: Retain the response cookie and send this token when logging in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with a provisioned account
      security:
        - cookieSession: []
          csrfToken: []
      description: The cookie may belong to an anonymous session from GET /auth/csrf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 254
                  example: staff@lsbu.ac.uk
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Session created; retain the new cookie and CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Incorrect credentials or inactive account. Both return INVALID_CREDENTIALS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token. Returns CSRF_INVALID.
        '413':
          description: Request body exceeds 8 KB.
        '429':
          description: Too many failed sign-ins from this IP. Retry after 15 minutes.
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the signed-in account and its current CSRF token
      responses:
        '200':
          description: Current user, with no password hash or session secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorised'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Destroy the server session and clear its cookie
      security:
        - cookieSession: []
          csrfToken: []
      responses:
        '204':
          description: Signed out. No response body.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: Missing or invalid CSRF token. Returns CSRF_INVALID.
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the signed-in account's notifications (US09)
      description: |
        Only the authenticated recipient's notifications for their own
        opportunities are returned. User IDs from query parameters never
        choose a different recipient. Defaults to unread for compatibility
        with the current bell menu; use status=read or status=all to retain
        previously read messages. Newest first, with descending ID as a stable
        tie-breaker. No records are marked read by this GET request.

        Under Review, approval/rejection decisions and delivery changes to In
        Progress, Testing and Completed generate notifications. Submission,
        unchanged saves, note/progress/date-only changes and recovered history
        do not. Automatic project creation at approval does not send a second
        message. The person who made the change is not notified about their
        own action. One notification is linked to each relevant history event
        and committed atomically with that event and its status update.
        Older stored messages are retained without invented event links.
        These are stored in-app messages, not email or real-time push delivery.
      parameters:
        - name: status
          in: query
          description: Single filter value. Repeated or invalid values return 400.
          schema:
            type: string
            enum: [unread, read, all]
            default: unread
      responses:
        '200':
          description: Matching notices and the total unread count for this account, from one database snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
              example:
                items:
                  - id: 82b90c34-5405-4a95-b69c-fd9520248430
                    opportunityId: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                    kind: under_review
                    message: Your opportunity “Automate booking emails” is now Under Review.
                    createdAt: '2026-11-22T10:00:00Z'
                    isRead: false
                    readAt: null
                unreadCount: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one of your notifications as read (US09)
      description: |
        Uses the authenticated recipient and checks opportunity ownership.
        No request body is required; the server supplies readAt. Repeating
        the action preserves the first read timestamp and still returns 204.
        Reading never deletes the stored notification. Unknown, malformed
        and another account's IDs all return 404. No public endpoint creates
        messages, chooses recipients or resets notifications to unread.
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked read. It remains available through status=read or status=all and is absent from the default unread view.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: Missing or invalid CSRF token. Returns CSRF_INVALID.
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities:
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Opportunities]
      operationId: submitOpportunity
      summary: Submit an opportunity (US01)
      description: |
        Saves a new opportunity with the initial status `submitted` and links
        it to the user making the request. Ordinary submissions are staff-only
        and default to `source: staff_submission`. AI Foundry team members can
        submit with `source: hackathon` and an optional `hackathonName`. The
        optional `expectedBenefits` field records the anticipated benefits
        described by the submitter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
            example:
              title: Automate room booking confirmations
              department: Estates
              problemDescription: Confirmation emails are written and sent by hand for every booking.
              proposedImprovement: Send confirmations automatically when a booking is approved.
              expectedBenefits: Reduce time spent on manual confirmations.
      responses:
        '201':
          description: Opportunity saved. Show the confirmation message.
          headers:
            Location:
              description: Relative URL of the saved opportunity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
              example:
                id: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                title: Automate room booking confirmations
                department: Estates
                problemDescription: Confirmation emails are written and sent by hand for every booking.
                proposedImprovement: Send confirmations automatically when a booking is approved.
                expectedBenefits: Reduce time spent on manual confirmations.
                status: submitted
                source: staff_submission
                submittedBy:
                  id: 6bfcbbab-9947-417e-9b04-d76efa7cb9b9
                  name: Demo Staff
                submittedAt: '2026-11-02T10:15:00Z'
                updatedAt: '2026-11-02T10:15:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Request body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported request charset or content encoding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Opportunities]
      operationId: listAllOpportunities
      summary: View and filter all opportunities (US03, US06)
      description: |
        Managers can list every opportunity. Engineers (`team`) can list approved
        opportunities and their own submissions, including hackathon entries.
        This visibility limit applies before filtering, pagination and counting.
        Filters can be combined. Category and priority are set during
        assessment, so they are empty on new submissions. Each item includes
        the title, department, opportunity status and any assigned priority.
        The optional `deliveryStatus` describes a linked delivery project.
        The website loads all pages and combines search and its displayed
        status, department and priority filters locally. An unset priority
        is displayed as "Not set".
      parameters:
        - name: status
          in: query
          description: |
            Filters the opportunity status. Approved opportunities stay
            approved while their separate projects progress through delivery.
            Use deliveryStatus in response items for delivery tracking.
          schema:
            $ref: '#/components/schemas/Status'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: department
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of opportunities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/opportunities:
    get:
      tags: [Opportunities]
      operationId: listMyOpportunities
      summary: View my opportunities (US02)
      description: |
        Returns only the opportunities submitted by the user named in
        the authenticated session. New submissions appear here straight away, with no
        extra steps.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the user's own opportunities. The list can be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
              example:
                items:
                  - id: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                    title: Automate room booking confirmations
                    department: Estates
                    status: submitted
                    submittedAt: '2026-11-02T10:15:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: View one opportunity in full (US02, US03)
      description: |
        Staff can only open their own opportunities. Managers can open any.
        Engineers can open approved opportunities and their own submissions,
        including hackathon entries.
      responses:
        '200':
          description: The full opportunity, including assessment and decision if they exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Opportunities]
      operationId: deleteOpportunity
      summary: Delete one of your opportunities
      description: |
        Removes an opportunity submitted by the signed-in user. Another
        person, including a manager or team member, cannot delete it. Once a
        delivery project is linked, the opportunity is protected from deletion.
      responses:
        '204':
          description: The opportunity was deleted.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The opportunity is linked to a delivery project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /opportunities/{id}/history:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    get:
      tags: [History]
      operationId: getOpportunityHistory
      summary: View the opportunity timeline (US08)
      description: |
        Manager only. Returns entries oldest first, ordered by occurredAt and
        then the increasing history ID to resolve equal timestamps. Each entry
        identifies its responsible user and records their display name at the
        time of recording. Opportunity and delivery statuses are distinguished
        by statusType; project delivery does not change the opportunity's
        approval status. Decision entries include the saved reason, or null
        when an approval has no reason. No history write endpoints exist.

        Submission, review transitions, decisions, project creation and delivery
        status changes are recorded atomically with the corresponding API write.
        Saving the same status, changing only progress/notes or resaving an
        assessment without a status change does not add a history event.

        Migration recovers stored submissions and the latest saved decision
        with their original dates and actor IDs. These entries have source
        backfill. Earlier overwritten changes cannot be reconstructed. Their
        fromStatus is null rather than an inferred previous status, and their
        actor names are the names available at migration time. Future entries
        have source live. Existing opportunity deletion policy still applies:
        deleting an eligible opportunity also removes its associated history.
      responses:
        '200':
          description: The selected opportunity's history; items may be empty for an externally imported record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityHistory'
              example:
                opportunityId: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                items:
                  - id: '21'
                    eventType: decision_recorded
                    statusType: opportunity
                    fromStatus: in_assessment
                    toStatus: rejected
                    actor:
                      id: 6bfcbbab-9947-417e-9b04-d76efa7cb9b9
                      name: Demo Manager
                    reason: Already covered by another project.
                    occurredAt: '2026-11-19T10:15:00.000Z'
                    source: live
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /opportunities/{id}/assessment:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    put:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Assessment]
      operationId: assessOpportunity
      summary: Assess and prioritise an opportunity (US03)
      description: |
        Manager only. Creates or replaces the assessment. Moves a `submitted`
        opportunity to `in_assessment`. How the five scores combine into a
        priority is still to be agreed, so for now the manager sets `priority`
        directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '200':
          description: Assessment saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /opportunities/{id}/benefit-suggestion:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Benefits]
      operationId: suggestOpportunityBenefit
      summary: Suggest one benefit from an opportunity description
      description: |
        Manager only. Reads the opportunity text and returns one draft benefit.
        Nothing is saved. A manager can review the draft and record it through
        the existing benefit endpoint once the opportunity has a delivery project.
        `estimated` is null when the description does not support a number.
      responses:
        '200':
          description: A draft benefit. It has not been recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitSuggestion'
              example:
                category: efficiency
                description: Staff would spend less time confirming room bookings.
                measurement: Hours saved confirming bookings
                unit: Hours/month
                estimated: 4
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The suggestion service returned an unusable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SUGGESTION_FAILED
                message: The benefit suggestion could not be created.
        '503':
          description: Benefit suggestions are not configured on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SUGGESTION_UNAVAILABLE
                message: Benefit suggestions are not configured.

  /opportunities/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Assessment]
      operationId: decideOpportunity
      summary: Approve or reject an opportunity (US03)
      description: |
        Manager only. The opportunity must be `in_assessment`, otherwise the
        call returns 409. A reason is required when rejecting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decision recorded and status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects:
    get:
      tags: [Delivery]
      operationId: listProjects
      summary: List approved projects (US04)
      description: Managers and team members can see all projects, including completed ones.
      responses:
        '200':
          description: Delivery projects, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Delivery]
      operationId: createProject
      summary: Move an approved opportunity to Project Delivery (US04)
      description: |
        Manager only. An approved opportunity can have one delivery project.
        New projects start as `not_started`. Delivery dates are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              description: Relative URL of the new project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The opportunity is not approved or already has a delivery project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Delivery]
      operationId: getProject
      summary: Open a project with its progress notes (US04)
      description: Managers and team members can read a project and its note history.
      responses:
        '200':
          $ref: '#/components/responses/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Delivery]
      operationId: updateProject
      summary: Update delivery status or add a progress note (US04)
      description: |
        Managers and team members can update projects. Only supplied fields
        are changed. A note is appended with the current user's name and
        timestamp. The status and note are saved together. Setting status
        to `completed` sets the progress estimate to 100%. A completed
        project stays completed: a later status change is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: The project is completed and its status cannot be changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: COMPLETED
                message: A completed project stays completed.

  /benefits:
    get:
      tags: [Benefits]
      operationId: listBenefits
      summary: List saved project benefits (US05)
      description: Managers and team members can read benefits. Staff access is denied.
      parameters:
        - name: projectId
          in: query
          description: Optional filter for one project. An empty result is returned if none match.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Benefits ordered by recorded date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Benefits]
      operationId: recordBenefit
      summary: Record a benefit for a delivery project (US05)
      description: Manager only. The project must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitInput'
            example:
              projectId: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
              category: efficiency
              description: Reduces manual booking administration.
              measurement: Staff hours saved per month
              estimated: 12.5
              actual: 8.25
              unit: Hours/month
              date: '2026-11-11'
              notes: Measured during the pilot.
      responses:
        '201':
          description: Benefit saved.
          headers:
            Location:
              description: Relative URL of the saved benefit.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
        '413':
          description: Request body exceeds 64 KiB.
        '415':
          description: Unsupported request charset or content encoding.

  /benefits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Benefits]
      operationId: getBenefit
      summary: Reopen a saved project benefit (US05)
      description: Managers and team members can read a benefit.
      responses:
        '200':
          $ref: '#/components/responses/Benefit'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
    put:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Benefits]
      operationId: updateBenefit
      summary: Edit a project benefit (US05)
      description: |
        Manager only. Replaces the editable fields. The project can be changed
        to another existing project. Omitted or empty notes clear the notes.
        Zero and negative measurements are supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitInput'
      responses:
        '200':
          $ref: '#/components/responses/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
        '413':
          description: Request body exceeds 64 KiB.
        '415':
          description: Unsupported request charset or content encoding.

  /benefits/summary:
    get:
      tags: [Benefits]
      operationId: getBenefitsSummary
      summary: Benefits dashboard data (US07)
      description: |
        Manager only. Reads current saved benefits on every request. Counts each
        benefit ID once; different IDs with equal values remain separate records.
        Estimated and actual values are summed separately for Hours/month,
        GBP/year and Cases/month. Units and reporting periods are never combined.
        Percent and Days records are returned individually under each project,
        because no shared denominator or additive duration definition is recorded.
        Decimal values are strings with four decimal places to preserve precision.
        No currency conversion, annualisation, averaging or deduplication by
        description is performed. Each stored benefit is assumed to represent an
        independent outcome; overlapping outcomes must be corrected in the records.
        Only projects with benefits appear in projects; completedProjects counts
        all completed delivery projects, including those with no recorded benefits.
      responses:
        '200':
          description: Portfolio totals and project comparisons, or zero totals and an empty message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitsSummary'
              example:
                completedProjects: 1
                totalBenefitsRecorded: 1
                projectCount: 1
                byCategory:
                  - category: efficiency
                    count: 1
                totals:
                  - {unit: Hours/month, estimated: '12.5000', actual: '8.2500', benefitCount: 1}
                  - {unit: GBP/year, estimated: '0.0000', actual: '0.0000', benefitCount: 0}
                  - {unit: Cases/month, estimated: '0.0000', actual: '0.0000', benefitCount: 0}
                projects:
                  - projectId: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                    project: Booking automation
                    benefitCount: 1
                    totals:
                      - {unit: Hours/month, estimated: '12.5000', actual: '8.2500', benefitCount: 1}
                      - {unit: GBP/year, estimated: '0.0000', actual: '0.0000', benefitCount: 0}
                      - {unit: Cases/month, estimated: '0.0000', actual: '0.0000', benefitCount: 0}
                    nonAdditiveBenefits: []
                message: null
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: foundry.sid
      description: Signed opaque session identifier. Session data is stored in PostgreSQL.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound CSRF token required for write requests.

  parameters:
    SolutionSearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
        default: ''
    SolutionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    OpportunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: |
        A leading minus means descending. Priority is ordered low, medium, high
        in ascending order, with unset priorities last in either direction.
      schema:
        type: string
        enum: [submittedAt, -submittedAt, priority, -priority]
        default: -submittedAt

  responses:
    ValidationError:
      description: One or more fields are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Some fields are missing or invalid.
            fields:
              title: Title is required.
              department: Department is required.
    Unauthorised:
      description: No valid session, or the account has been disabled. Sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORISED
            message: Your session has ended. Please sign in.
    Forbidden:
      description: This user's role cannot do that.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have permission to do that.
    NotFound:
      description: No opportunity with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Opportunity not found.
    Benefit:
      description: The saved benefit and its linked project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Benefit'
    BenefitNotFound:
      description: The benefit or selected project does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectDetail:
      description: The project and all saved notes, newest first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    ProjectNotFound:
      description: No project with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The opportunity is not in a status that allows this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_STATUS
            message: This opportunity cannot move to that status from its current one.

  schemas:
    SolutionCheckInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 800
        previousMessages:
          type: array
          maxItems: 8
          default: []
          items:
            type: object
            additionalProperties: false
            required: [role, text]
            properties:
              role:
                type: string
                enum: [user, assistant]
              text:
                type: string
                minLength: 1
                maxLength: 800
    SolutionRecommendation:
      type: object
      additionalProperties: false
      required: [id, name, description, href, accessInstructions, reason]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        href:
          type: string
          nullable: true
          description: Current HTTPS link from the verified catalogue, or null when access instructions are used.
        accessInstructions:
          type: string
          nullable: true
        reason:
          type: string
          maxLength: 240
    SolutionCheckResult:
      type: object
      required: [decision, question, matches, canSubmit, message]
      properties:
        decision:
          type: string
          enum: [match, none, clarify, unavailable]
        question:
          type: string
          nullable: true
          maxLength: 240
        matches:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/SolutionRecommendation'
        canSubmit:
          type: boolean
          enum: [true]
        message:
          type: string
    SolutionCheckFailure:
      allOf:
        - $ref: '#/components/schemas/SolutionCheckResult'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SOLUTION_CHECK_UNAVAILABLE, SOLUTION_CHECK_FAILED, TOO_MANY_CHECKS]
    SolutionInput:
      type: object
      additionalProperties: false
      required: [name, description]
      description: |
        At least one of href or accessInstructions must be nonempty.
        verified=true requires nonempty verificationNotes. Only managers may write.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        keywords:
          type: array
          maxItems: 20
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 50
        href:
          type: string
          nullable: true
          maxLength: 2000
          description: HTTPS URL without embedded credentials, or null.
        accessInstructions:
          type: string
          nullable: true
          maxLength: 1000
        visibility:
          type: string
          enum: [all_users, manager_only]
          default: all_users
        active:
          type: boolean
          default: true
        verified:
          type: boolean
          default: false
        verificationNotes:
          type: string
          nullable: true
          maxLength: 2000
    PublishedSolution:
      type: object
      additionalProperties: false
      required: [id, name, description, href, accessInstructions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        href:
          type: string
          nullable: true
        accessInstructions:
          type: string
          nullable: true
    ManagedSolution:
      type: object
      required: [id, name, description, href, accessInstructions, keywords, visibility, active, verified, verificationNotes, verifiedBy, verifiedAt, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        href:
          type: string
          nullable: true
        accessInstructions:
          type: string
          nullable: true
        keywords:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [all_users, manager_only]
        active:
          type: boolean
        verified:
          type: boolean
        verificationNotes:
          type: string
          nullable: true
        verifiedBy:
          type: string
          format: uuid
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SolutionSearchPage:
      type: object
      required: [items, total, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedSolution'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 50
    SolutionCataloguePage:
      type: object
      required: [items, total, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedSolution'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 50
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [staff, manager, team]
    AuthSession:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrfToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Status:
      type: string
      enum: [submitted, in_assessment, approved, rejected, in_progress, completed]

    Priority:
      type: string
      enum: [high, medium, low]

    Category:
      type: string
      description: Placeholder list, to be agreed by the team.
      enum: [automation, ai_assistant, reporting, process_improvement, other]

    BenefitCategory:
      type: string
      enum: [efficiency, financial, service, risk_reduction, data, strategic]

    Source:
      type: string
      enum: [staff_submission, hackathon]

    UserRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    OpportunityCreate:
      type: object
      required: [title, department, problemDescription, proposedImprovement]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        department:
          type: string
          minLength: 1
          maxLength: 100
        problemDescription:
          type: string
          minLength: 1
          maxLength: 2000
        proposedImprovement:
          type: string
          minLength: 1
          maxLength: 2000
        expectedBenefits:
          type: string
          maxLength: 500
          description: Anticipated benefits described by the submitter.
        source:
          $ref: '#/components/schemas/Source'
        hackathonName:
          type: string
          description: Only used when source is hackathon.

    OpportunitySummary:
      type: object
      description: Used in lists.
      properties:
        id:
          type: string
        title:
          type: string
        department:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        deliveryStatus:
          allOf:
            - $ref: '#/components/schemas/ProjectStatus'
          description: Current status of the linked project, when present in a read response.
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        submittedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: Included in the all-opportunities queue.
        submittedAt:
          type: string
          format: date-time

    Notification:
      type: object
      required: [id, opportunityId, kind, message, createdAt, isRead, readAt]
      properties:
        id:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [under_review, approved, rejected, delivery_started, in_progress, testing, project_completed]
        message:
          type: string
        createdAt:
          type: string
          format: date-time

        isRead:
          type: boolean
          description: True exactly when readAt is not null.
        readAt:
          type: string
          format: date-time
          nullable: true
          description: First time this notification was marked read; null while unread.

    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: integer
          minimum: 0
          description: Total unread notifications for the authenticated owner, regardless of the chosen status filter.

    Opportunity:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        department:
          type: string
        problemDescription:
          type: string
        proposedImprovement:
          type: string
        expectedBenefits:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/Status'
        deliveryStatus:
          allOf:
            - $ref: '#/components/schemas/ProjectStatus'
          description: Current status of the linked project, when present in a read response.
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        source:
          $ref: '#/components/schemas/Source'
        hackathonName:
          type: string
        submittedBy:
          $ref: '#/components/schemas/UserRef'
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          format: uuid
          description: The linked delivery project, when present.
        assessment:
          $ref: '#/components/schemas/Assessment'
        decision:
          $ref: '#/components/schemas/Decision'

    OpportunityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpportunitySummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    AssessmentInput:
      type: object
      required:
        - strategicAlignment
        - benefitPotential
        - complexity
        - resourceRequirements
        - speedToValue
        - priority
      properties:
        strategicAlignment:
          type: integer
          minimum: 1
          maximum: 5
        benefitPotential:
          type: integer
          minimum: 1
          maximum: 5
        complexity:
          type: integer
          minimum: 1
          maximum: 5
        resourceRequirements:
          type: integer
          minimum: 1
          maximum: 5
        speedToValue:
          type: integer
          minimum: 1
          maximum: 5
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        notes:
          type: string
          maxLength: 2000

    Assessment:
      allOf:
        - $ref: '#/components/schemas/AssessmentInput'
        - type: object
          properties:
            assessedBy:
              $ref: '#/components/schemas/UserRef'
            assessedAt:
              type: string
              format: date-time

    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 2000
          description: Required when the decision is rejected.
      example:
        decision: rejected
        reason: Out of scope for this year.

    Decision:
      allOf:
        - $ref: '#/components/schemas/DecisionInput'
        - type: object
          properties:
            decidedBy:
              $ref: '#/components/schemas/UserRef'
            decidedAt:
              type: string
              format: date-time

    ProjectStatus:
      type: string
      enum: [not_started, in_progress, testing, completed]

    ProjectCreate:
      type: object
      required: [opportunityId]
      properties:
        opportunityId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: On or after the start date, if both dates are supplied.

    ProjectUpdate:
      type: object
      anyOf:
        - required: [status]
        - required: [progress]
        - required: [note]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        note:
          type: string
          minLength: 1
          maxLength: 2000

    Project:
      type: object
      required: [id, opportunityId, title, department, description, priority, status, progress, startDate, targetDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid
        title:
          type: string
        department:
          type: string
        description:
          type: string
          description: Proposed improvement from the approved opportunity.
        priority:
          type: string
          nullable: true
          enum: [high, medium, low, null]
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [notes]
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/ProjectProgressNote'

    ProjectProgressNote:
      type: object
      required: [id, text, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    BenefitSuggestion:
      type: object
      required: [category, description, measurement, unit, estimated]
      properties:
        category:
          $ref: '#/components/schemas/BenefitCategory'
        description:
          type: string
          minLength: 1
          maxLength: 2000
        measurement:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          type: string
          enum: [Hours/month, GBP/year, Percent, Days, Cases/month]
        estimated:
          type: number
          nullable: true
          minimum: -999999999.9999
          maximum: 999999999.9999
          multipleOf: 0.0001
          description: Null when the opportunity text does not support a quantity.

    BenefitInput:
      type: object
      required: [projectId, category, description, measurement, estimated, actual, unit, date]
      properties:
        projectId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/BenefitCategory'
        description:
          type: string
          minLength: 1
          maxLength: 2000
        measurement:
          type: string
          minLength: 1
          maxLength: 200
        estimated:
          $ref: '#/components/schemas/BenefitValue'
        actual:
          $ref: '#/components/schemas/BenefitValue'
        unit:
          type: string
          enum: [Hours/month, GBP/year, Percent, Days, Cases/month]
        date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 2000

    BenefitValue:
      type: number
      minimum: -999999999.9999
      maximum: 999999999.9999
      multipleOf: 0.0001
      description: A signed value with up to four decimal places. Zero is a valid recorded value.

    Benefit:
      allOf:
        - $ref: '#/components/schemas/BenefitInput'
        - type: object
          required: [id, project, notes, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            project:
              type: string
              description: Title of the linked project.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    BenefitsSummary:
      type: object
      required: [completedProjects, totalBenefitsRecorded, projectCount, byCategory, totals, projects, message]
      properties:
        completedProjects:
          type: integer
          minimum: 0
          description: All completed delivery projects, even those with no benefits.
        totalBenefitsRecorded:
          type: integer
          minimum: 0
          description: Number of distinct saved benefit IDs across all units.
        projectCount:
          type: integer
          minimum: 0
          description: Number of projects with at least one saved benefit.
        byCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                $ref: '#/components/schemas/BenefitCategory'
              count:
                type: integer
                minimum: 1
        totals:
          $ref: '#/components/schemas/BenefitTotals'
        projects:
          type: array
          description: Projects with benefits, ordered by project ID.
          items:
            $ref: '#/components/schemas/ProjectBenefitsSummary'
        message:
          type: string
          nullable: true
          description: No benefits have been recorded yet, or null when records exist.

    BenefitDecimal:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{4}$'
      description: Exact signed decimal with four fractional places; totals are not restricted to the single-record value limit.
      example: '12.5000'

    BenefitUnitTotal:
      type: object
      required: [unit, estimated, actual, benefitCount]
      properties:
        unit:
          type: string
          enum: [Hours/month, GBP/year, Cases/month]
        estimated:
          $ref: '#/components/schemas/BenefitDecimal'
        actual:
          $ref: '#/components/schemas/BenefitDecimal'
        benefitCount:
          type: integer
          minimum: 0
          description: Number of saved benefits contributing to this unit total.

    BenefitTotals:
      type: array
      minItems: 3
      maxItems: 3
      description: Exactly one entry per additive unit, ordered Hours/month, GBP/year, Cases/month. Missing units have zero totals.
      items:
        $ref: '#/components/schemas/BenefitUnitTotal'

    ProjectBenefitsSummary:
      type: object
      required: [projectId, project, benefitCount, totals, nonAdditiveBenefits]
      properties:
        projectId:
          type: string
          format: uuid
        project:
          type: string
          description: Current project title from the linked opportunity.
        benefitCount:
          type: integer
          minimum: 1
        totals:
          $ref: '#/components/schemas/BenefitTotals'
        nonAdditiveBenefits:
          type: array
          description: Percent and Days measures, individually compared and ordered by benefit ID.
          items:
            $ref: '#/components/schemas/NonAdditiveBenefit'

    NonAdditiveBenefit:
      type: object
      required: [id, category, description, measurement, unit, estimated, actual, date]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/BenefitCategory'
        description:
          type: string
        measurement:
          type: string
        unit:
          type: string
          enum: [Percent, Days]
        estimated:
          $ref: '#/components/schemas/BenefitDecimal'
        actual:
          $ref: '#/components/schemas/BenefitDecimal'
        date:
          type: string
          format: date

    OpportunityHistory:
      type: object
      required: [opportunityId, items]
      properties:
        opportunityId:
          type: string
          format: uuid
        items:
          type: array
          description: Chronological entries, oldest first; equal timestamps are ordered by increasing ID.
          items:
            $ref: '#/components/schemas/OpportunityHistoryEntry'

    OpportunityHistoryEntry:
      type: object
      readOnly: true
      required: [id, eventType, statusType, fromStatus, toStatus, actor, reason, occurredAt, source]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Database sequence ID represented as a string to preserve bigint precision. Treat as an opaque identifier.
        eventType:
          type: string
          enum: [submitted, status_changed, decision_recorded, delivery_started, delivery_status_changed]
        statusType:
          type: string
          enum: [opportunity, delivery]
          description: The lifecycle to which fromStatus and toStatus belong.
        fromStatus:
          type: string
          nullable: true
          enum: [submitted, in_assessment, approved, rejected, not_started, in_progress, testing, completed, null]
          description: Null for creation events and recovered decisions whose previous status was not stored.
        toStatus:
          type: string
          enum: [submitted, in_assessment, approved, rejected, not_started, in_progress, testing, completed]
        actor:
          $ref: '#/components/schemas/UserRef'
        reason:
          type: string
          nullable: true
          maxLength: 2000
          description: Decision reason; required and nonblank for rejections, nullable for approvals, null for other event types.
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [live, backfill]
          description: Live API event or recovered pre-US08 submission/decision.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example VALIDATION_ERROR.
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name to message. Only on validation errors.
