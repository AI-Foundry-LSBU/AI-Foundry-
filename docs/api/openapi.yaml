openapi: 3.0.3

info:
  title: AI Foundry Opportunity Tracker API
  version: 0.1.0
  description: |
    API contract for the AI Foundry opportunity tracker.

    This file is the single source of truth for the frontend and backend.
    Change it through a pull request and let both sides review it before merging.

    **Product backlog priorities:** US01-US07 are Must-have and US08 is
    Should-have. MoSCoW priority describes the importance of a story for the
    product and does not mean that every Must-have story must be completed in
    Sprint 1.

    **Sprint scope:** US01 and US02 form the initial submission and tracking
    workflow. Sprint 2 adds manager assessment (US03), project delivery
    (US04), project benefit recording (US05), filtering (US06) and account
    authentication. The benefits dashboard (US07) is planned for Sprint 3.

    **Sign-in:** provisioned coursework accounts use email and an application
    password. Login creates a PostgreSQL-backed session in the HttpOnly
    `foundry.sid` cookie. Cookies use SameSite=Lax and Secure under HTTPS.
    Sessions expire after 30 minutes idle or eight hours total. Public account
    registration and institutional Microsoft sign-in are outside this version.
    The LSBU-looking usernames are demo identifiers, not university mailboxes.
    `X-User-Email` never authenticates a request.

    **CSRF:** first call GET /auth/csrf and retain its anonymous session cookie.
    Send the returned token in X-CSRF-Token when logging in. Login rotates both
    the session identifier and token. Login and GET /auth/me return the current
    token for subsequent POST, PUT, PATCH and DELETE requests, including logout.
    Browser requests use the same origin through the Vite API proxy.

    **Roles:** `staff`, `manager` (Digital Project Manager) and `team`
    (AI Foundry team member).

    **Status lifecycle:**
    `submitted` -> `in_assessment` -> `approved` or `rejected`.
    Project delivery has a separate status. Once approved, an opportunity
    can be moved into Project Delivery by a manager.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Password login and PostgreSQL sessions
  - name: Opportunities
    description: Submitting and viewing opportunities (US01, US02, US03)
  - name: Assessment
    description: Assessing, prioritising and deciding (US03)
  - name: Delivery
    description: Tracking project delivery (US04)
  - name: Benefits
    description: Recording project benefits (US05); dashboard planned for US07

security:
  - cookieSession: []

paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Start an anonymous session and obtain a CSRF token
      security: []
      responses:
        '200':
          description: Retain the response cookie and send this token when logging in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with a provisioned account
      security:
        - cookieSession: []
          csrfToken: []
      description: The cookie may belong to an anonymous session from GET /auth/csrf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 254
                  example: staff@lsbu.ac.uk
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Session created; retain the new cookie and CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Incorrect credentials or inactive account. Both return INVALID_CREDENTIALS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token. Returns CSRF_INVALID.
        '413':
          description: Request body exceeds 8 KB.
        '429':
          description: Too many failed sign-ins from this IP. Retry after 15 minutes.
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the signed-in account and its current CSRF token
      responses:
        '200':
          description: Current user, with no password hash or session secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorised'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Destroy the server session and clear its cookie
      security:
        - cookieSession: []
          csrfToken: []
      responses:
        '204':
          description: Signed out. No response body.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: Missing or invalid CSRF token. Returns CSRF_INVALID.
  /opportunities:
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Opportunities]
      operationId: submitOpportunity
      summary: Submit an opportunity (US01)
      description: |
        Saves a new opportunity with the initial status `submitted` and links
        it to the user making the request. Ordinary submissions are staff-only
        and default to `source: staff_submission`. AI Foundry team members can
        submit with `source: hackathon` and an optional `hackathonName`. The
        optional `expectedBenefits` field records the anticipated benefits
        described by the submitter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
            example:
              title: Automate room booking confirmations
              department: Estates
              problemDescription: Confirmation emails are written and sent by hand for every booking.
              proposedImprovement: Send confirmations automatically when a booking is approved.
              expectedBenefits: Reduce time spent on manual confirmations.
      responses:
        '201':
          description: Opportunity saved. Show the confirmation message.
          headers:
            Location:
              description: Relative URL of the saved opportunity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
              example:
                id: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                title: Automate room booking confirmations
                department: Estates
                problemDescription: Confirmation emails are written and sent by hand for every booking.
                proposedImprovement: Send confirmations automatically when a booking is approved.
                expectedBenefits: Reduce time spent on manual confirmations.
                status: submitted
                source: staff_submission
                submittedBy:
                  id: 6bfcbbab-9947-417e-9b04-d76efa7cb9b9
                  name: Demo Staff
                submittedAt: '2026-11-02T10:15:00Z'
                updatedAt: '2026-11-02T10:15:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Request body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported request charset or content encoding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Opportunities]
      operationId: listAllOpportunities
      summary: View and filter all opportunities (US03, US06)
      description: |
        Managers can list every opportunity. Engineers (`team`) can list approved
        opportunities and their own submissions, including hackathon entries.
        This visibility limit applies before filtering, pagination and counting.
        Filters can be combined. Category and priority are set during
        assessment, so they are empty on new submissions. Each item includes
        the title, department, opportunity status and any assigned priority.
        The optional `deliveryStatus` describes a linked delivery project.
        The website loads all pages and combines search and its displayed
        status, department and priority filters locally. An unset priority
        is displayed as "Not set".
      parameters:
        - name: status
          in: query
          description: |
            Filters the opportunity status. Approved opportunities stay
            approved while their separate projects progress through delivery.
            Use deliveryStatus in response items for delivery tracking.
          schema:
            $ref: '#/components/schemas/Status'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: department
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of opportunities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/opportunities:
    get:
      tags: [Opportunities]
      operationId: listMyOpportunities
      summary: View my opportunities (US02)
      description: |
        Returns only the opportunities submitted by the user named in
        the authenticated session. New submissions appear here straight away, with no
        extra steps.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the user's own opportunities. The list can be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
              example:
                items:
                  - id: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
                    title: Automate room booking confirmations
                    department: Estates
                    status: submitted
                    submittedAt: '2026-11-02T10:15:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: View one opportunity in full (US02, US03)
      description: |
        Staff can only open their own opportunities. Managers can open any.
        Engineers can open approved opportunities and their own submissions,
        including hackathon entries.
      responses:
        '200':
          description: The full opportunity, including assessment and decision if they exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Opportunities]
      operationId: deleteOpportunity
      summary: Delete one of your opportunities
      description: |
        Removes an opportunity submitted by the signed-in user. Another
        person, including a manager or team member, cannot delete it. Once a
        delivery project is linked, the opportunity is protected from deletion.
      responses:
        '204':
          description: The opportunity was deleted.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The opportunity is linked to a delivery project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /opportunities/{id}/assessment:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    put:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Assessment]
      operationId: assessOpportunity
      summary: Assess and prioritise an opportunity (US03)
      description: |
        Manager only. Creates or replaces the assessment. Moves a `submitted`
        opportunity to `in_assessment`. How the five scores combine into a
        priority is still to be agreed, so for now the manager sets `priority`
        directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '200':
          description: Assessment saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /opportunities/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/OpportunityId'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Assessment]
      operationId: decideOpportunity
      summary: Approve or reject an opportunity (US03)
      description: |
        Manager only. The opportunity must be `in_assessment`, otherwise the
        call returns 409. A reason is required when rejecting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Decision recorded and status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects:
    get:
      tags: [Delivery]
      operationId: listProjects
      summary: List approved projects (US04)
      description: Managers and team members can see all projects, including completed ones.
      responses:
        '200':
          description: Delivery projects, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Delivery]
      operationId: createProject
      summary: Move an approved opportunity to Project Delivery (US04)
      description: |
        Manager only. An approved opportunity can have one delivery project.
        New projects start as `not_started`. Delivery dates are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              description: Relative URL of the new project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The opportunity is not approved or already has a delivery project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Delivery]
      operationId: getProject
      summary: Open a project with its progress notes (US04)
      description: Managers and team members can read a project and its note history.
      responses:
        '200':
          $ref: '#/components/responses/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Delivery]
      operationId: updateProject
      summary: Update delivery status or add a progress note (US04)
      description: |
        Managers and team members can update projects. Only supplied fields
        are changed. A note is appended with the current user's name and
        timestamp. The status and note are saved together. Setting status
        to `completed` sets the progress estimate to 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /benefits:
    get:
      tags: [Benefits]
      operationId: listBenefits
      summary: List saved project benefits (US05)
      description: Managers and team members can read benefits. Staff access is denied.
      parameters:
        - name: projectId
          in: query
          description: Optional filter for one project. An empty result is returned if none match.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Benefits ordered by recorded date, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Benefits]
      operationId: recordBenefit
      summary: Record a benefit for a delivery project (US05)
      description: Manager only. The project must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitInput'
            example:
              projectId: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
              category: efficiency
              description: Reduces manual booking administration.
              measurement: Staff hours saved per month
              estimated: 12.5
              actual: 8.25
              unit: Hours/month
              date: '2026-11-11'
              notes: Measured during the pilot.
      responses:
        '201':
          description: Benefit saved.
          headers:
            Location:
              description: Relative URL of the saved benefit.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
        '413':
          description: Request body exceeds 64 KiB.
        '415':
          description: Unsupported request charset or content encoding.

  /benefits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Benefits]
      operationId: getBenefit
      summary: Reopen a saved project benefit (US05)
      description: Managers and team members can read a benefit.
      responses:
        '200':
          $ref: '#/components/responses/Benefit'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
    put:
      security:
        - cookieSession: []
          csrfToken: []
      tags: [Benefits]
      operationId: updateBenefit
      summary: Edit a project benefit (US05)
      description: |
        Manager only. Replaces the editable fields. The project can be changed
        to another existing project. Omitted or empty notes clear the notes.
        Zero and negative measurements are supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitInput'
      responses:
        '200':
          $ref: '#/components/responses/Benefit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BenefitNotFound'
        '413':
          description: Request body exceeds 64 KiB.
        '415':
          description: Unsupported request charset or content encoding.

  /benefits/summary:
    get:
      tags: [Benefits]
      operationId: getBenefitsSummary
      summary: Benefits dashboard data (US07, planned)
      description: Planned for Sprint 3. Manager only. Totals across saved project benefits.
      responses:
        '200':
          description: Overall impact figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitsSummary'
              example:
                completedProjects: 3
                totalBenefitsRecorded: 7
                byCategory:
                  - category: efficiency
                    count: 4
                  - category: financial
                    count: 2
                  - category: service
                    count: 1
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: foundry.sid
      description: Signed opaque session identifier. Session data is stored in PostgreSQL.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound CSRF token required for write requests.

  parameters:
    OpportunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: 7f6c00a8-b782-4bd5-8d1a-5fdad6b2cb2e
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: |
        A leading minus means descending. Priority is ordered low, medium, high
        in ascending order, with unset priorities last in either direction.
      schema:
        type: string
        enum: [submittedAt, -submittedAt, priority, -priority]
        default: -submittedAt

  responses:
    ValidationError:
      description: One or more fields are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Some fields are missing or invalid.
            fields:
              title: Title is required.
              department: Department is required.
    Unauthorised:
      description: No valid session, or the account has been disabled. Sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORISED
            message: Your session has ended. Please sign in.
    Forbidden:
      description: This user's role cannot do that.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have permission to do that.
    NotFound:
      description: No opportunity with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Opportunity not found.
    Benefit:
      description: The saved benefit and its linked project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Benefit'
    BenefitNotFound:
      description: The benefit or selected project does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectDetail:
      description: The project and all saved notes, newest first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    ProjectNotFound:
      description: No project with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The opportunity is not in a status that allows this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_STATUS
            message: This opportunity cannot move to that status from its current one.

  schemas:
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [staff, manager, team]
    AuthSession:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrfToken:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Status:
      type: string
      enum: [submitted, in_assessment, approved, rejected, in_progress, completed]

    Priority:
      type: string
      enum: [high, medium, low]

    Category:
      type: string
      description: Placeholder list, to be agreed by the team.
      enum: [automation, ai_assistant, reporting, process_improvement, other]

    BenefitCategory:
      type: string
      enum: [efficiency, financial, service, risk_reduction, data, strategic]

    Source:
      type: string
      enum: [staff_submission, hackathon]

    UserRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    OpportunityCreate:
      type: object
      required: [title, department, problemDescription, proposedImprovement]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        department:
          type: string
          minLength: 1
          maxLength: 100
        problemDescription:
          type: string
          minLength: 1
          maxLength: 2000
        proposedImprovement:
          type: string
          minLength: 1
          maxLength: 2000
        expectedBenefits:
          type: string
          maxLength: 500
          description: Anticipated benefits described by the submitter.
        source:
          $ref: '#/components/schemas/Source'
        hackathonName:
          type: string
          description: Only used when source is hackathon.

    OpportunitySummary:
      type: object
      description: Used in lists.
      properties:
        id:
          type: string
        title:
          type: string
        department:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        deliveryStatus:
          allOf:
            - $ref: '#/components/schemas/ProjectStatus'
          description: Current status of the linked project, when present in a read response.
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        submittedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: Included in the all-opportunities queue.
        submittedAt:
          type: string
          format: date-time

    Opportunity:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        department:
          type: string
        problemDescription:
          type: string
        proposedImprovement:
          type: string
        expectedBenefits:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/Status'
        deliveryStatus:
          allOf:
            - $ref: '#/components/schemas/ProjectStatus'
          description: Current status of the linked project, when present in a read response.
        source:
          $ref: '#/components/schemas/Source'
        hackathonName:
          type: string
        submittedBy:
          $ref: '#/components/schemas/UserRef'
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          format: uuid
          description: The linked delivery project, when present.
        assessment:
          $ref: '#/components/schemas/Assessment'
        decision:
          $ref: '#/components/schemas/Decision'

    OpportunityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpportunitySummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    AssessmentInput:
      type: object
      required:
        - strategicAlignment
        - benefitPotential
        - complexity
        - resourceRequirements
        - speedToValue
        - priority
      properties:
        strategicAlignment:
          type: integer
          minimum: 1
          maximum: 5
        benefitPotential:
          type: integer
          minimum: 1
          maximum: 5
        complexity:
          type: integer
          minimum: 1
          maximum: 5
        resourceRequirements:
          type: integer
          minimum: 1
          maximum: 5
        speedToValue:
          type: integer
          minimum: 1
          maximum: 5
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        notes:
          type: string
          maxLength: 2000

    Assessment:
      allOf:
        - $ref: '#/components/schemas/AssessmentInput'
        - type: object
          properties:
            assessedBy:
              $ref: '#/components/schemas/UserRef'
            assessedAt:
              type: string
              format: date-time

    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 2000
          description: Required when the decision is rejected.
      example:
        decision: rejected
        reason: Out of scope for this year.

    Decision:
      allOf:
        - $ref: '#/components/schemas/DecisionInput'
        - type: object
          properties:
            decidedBy:
              $ref: '#/components/schemas/UserRef'
            decidedAt:
              type: string
              format: date-time

    ProjectStatus:
      type: string
      enum: [not_started, in_progress, testing, completed]

    ProjectCreate:
      type: object
      required: [opportunityId]
      properties:
        opportunityId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
          description: On or after the start date, if both dates are supplied.

    ProjectUpdate:
      type: object
      anyOf:
        - required: [status]
        - required: [progress]
        - required: [note]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        note:
          type: string
          minLength: 1
          maxLength: 2000

    Project:
      type: object
      required: [id, opportunityId, title, department, description, priority, status, progress, startDate, targetDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid
        title:
          type: string
        department:
          type: string
        description:
          type: string
          description: Proposed improvement from the approved opportunity.
        priority:
          type: string
          nullable: true
          enum: [high, medium, low, null]
        status:
          $ref: '#/components/schemas/ProjectStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [notes]
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/ProjectProgressNote'

    ProjectProgressNote:
      type: object
      required: [id, text, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    BenefitInput:
      type: object
      required: [projectId, category, description, measurement, estimated, actual, unit, date]
      properties:
        projectId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/BenefitCategory'
        description:
          type: string
          minLength: 1
          maxLength: 2000
        measurement:
          type: string
          minLength: 1
          maxLength: 200
        estimated:
          $ref: '#/components/schemas/BenefitValue'
        actual:
          $ref: '#/components/schemas/BenefitValue'
        unit:
          type: string
          enum: [Hours/month, GBP/year, Percent, Days, Cases/month]
        date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 2000

    BenefitValue:
      type: number
      minimum: -999999999.9999
      maximum: 999999999.9999
      multipleOf: 0.0001
      description: A signed value with up to four decimal places. Zero is a valid recorded value.

    Benefit:
      allOf:
        - $ref: '#/components/schemas/BenefitInput'
        - type: object
          required: [id, project, notes, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            project:
              type: string
              description: Title of the linked project.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    BenefitsSummary:
      type: object
      properties:
        completedProjects:
          type: integer
        totalBenefitsRecorded:
          type: integer
        byCategory:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/BenefitCategory'
              count:
                type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example VALIDATION_ERROR.
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name to message. Only on validation errors.
